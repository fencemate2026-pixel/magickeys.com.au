[build]
  base = "."
  command = "npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/login"
  to = "/client-login/"
  status = 302

[[redirects]]
  from = "/login/"
  to = "/client-login/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


# Consolidate explicit index URLs into the public directory URLs.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:section/index.html"
  to = "/:section/"
  status = 301
  force = true

[[redirects]]
  from = "/solutions/:sector/index.html"
  to = "/solutions/:sector/"
  status = 301
  force = true
